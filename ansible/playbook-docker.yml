- hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3
          - python3-pip
          - python3-venv
        state: present
        update_cache: true

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_facts['distribution_release'] }} stable"
        state: present
        update_cache: true

    - name: Install Docker
      apt:
        name: docker-ce
        state: present

    - name: Install Docker SDK for Python in a virtual environment
      pip:
        name: docker
        virtualenv: /opt/docker_venv
        virtualenv_command: python3 -m venv

    - name: Make sure Docker is running
      service:
        name: docker
        state: started
        enabled: true
      tags: docker
